<div class="dc-actionbar" id="dc-actionbar" data-hidden="false" role="region" aria-label="Prendre rendez-vous rapidement">
<a class="dc-ab-call" href="{{PHONE_HREF}}" data-dc-action="phone" data-dc-source="actionbar"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg><span>Appeler</span><span class="dc-ab-num">&nbsp;{{PHONE_DISPLAY}}</span></a>
<a class="dc-ab-book" href="#demande" data-dc-action="appointment" data-dc-source="actionbar">Prendre rendez-vous</a>
</div>
<script>
(function(w,d){'use strict';
var bar=d.getElementById('dc-actionbar');if(!bar)return;
var formBox=d.getElementById('demande');var formVisible=false;
function desktop(){return w.innerWidth>900}
function update(){var hide=formVisible||(desktop()&&w.scrollY<560);bar.setAttribute('data-hidden',hide?'true':'false');
 var links=bar.querySelectorAll('a');for(var i=0;i<links.length;i++){if(hide)links[i].setAttribute('tabindex','-1');else links[i].removeAttribute('tabindex')}}
if(formBox&&'IntersectionObserver' in w){new IntersectionObserver(function(es){es.forEach(function(e){formVisible=e.isIntersecting});update()},{threshold:0.2}).observe(formBox)}
w.addEventListener('scroll',update,{passive:true});w.addEventListener('resize',update);update();
}(window,document));
</script>
